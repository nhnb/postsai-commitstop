<h1>Postsai Commit Permissions</h1>

<app-config-editor [(code)]="currentConfig().configText"> </app-config-editor>

Comment:
<input type="text" [(ngModel)]="currentConfig().changeComment" />
<button (click)="doSubmit()">submit</button>
<p>Pick a previous config:</p>

<div>
  <ngx-datatable
    [rows]="rows()"
    [columns]="columns"
    class="material selection-row"
    style="width: 80%"
    (selectedChange)="onSelect()"
    [columnMode]="'force'"
    [headerHeight]="'auto'"
    [footerHeight]="'auto'"
    [rowHeight]="'auto'"
    [(selected)]="selected"
    [selectionType]="'single'"
    [limit]="10"
  >
  </ngx-datatable>
</div>
